[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sanad-legal-rag"
version = "2.0.0"
description = "Sanad — bilingual, citation-first legal document intelligence built on Gemini retrieval-augmented generation."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "mohammedalmohawis" }]
keywords = ["legal", "rag", "retrieval", "gemini", "arabic", "streamlit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Streamlit",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Arabic",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.11",
    "Topic :: Text Processing :: Linguistic",
]

# Upper bounds are set at the next major version: these are the boundaries at
# which each project documents breaking changes. Lower bounds are the versions
# the application is verified against.
dependencies = [
    "streamlit>=1.40,<2",
    "requests>=2.32,<3",
    "python-dotenv>=1.0,<2",
    "PyMuPDF>=1.24,<2",
    "python-docx>=1.1,<2",
    "numpy>=1.24,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/mohammedalmohawis/alsaree-legal-rag-assistant"
Repository = "https://github.com/mohammedalmohawis/alsaree-legal-rag-assistant"
Issues = "https://github.com/mohammedalmohawis/alsaree-legal-rag-assistant/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sanad = ["ui/assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # line length is enforced by the formatter, not the linter
    "B008",  # Streamlit's API is built around calls in default position
]

[tool.ruff.lint.isort]
known-first-party = ["sanad"]
